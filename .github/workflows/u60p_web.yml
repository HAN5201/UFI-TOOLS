name: 中兴 U60p 网页控制台真正云编译

on:
  workflow_dispatch: # 允许你手动点击按钮开始编译

jobs:
  build_job:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取源码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. 注入 U60p 1秒网速追踪补丁
        run: |
          TARGET_FILE="app/frontEnd/src/components/NetworkStatus.vue"
          if [ -f "$TARGET_FILE" ]; then
            sed -i 's/3000/1000/g' "$TARGET_FILE"
            sed -i 's/5000/1000/g' "$TARGET_FILE"
          fi

      - name: 4. 执行网页编译
        run: |
          cd app/frontEnd
          npm install
          npm run build

      - name: 5. 将网页打包并在网页下方生成文件
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_U60p_Web_Console_Ready
          path: app/frontEnd/dist/
