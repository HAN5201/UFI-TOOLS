name: 中兴 U60p 网页控制台真正云编译

on:
  workflow_dispatch:

jobs:
  build_job:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取源码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. 注入 U60p 1秒网速追踪补丁
        run: |
          # 遍历寻找 NetworkStatus.vue 文件并替换时间
          find . -name "NetworkStatus.vue" -exec sed -i 's/3000/1000/g' {} +
          find . -name "NetworkStatus.vue" -exec sed -i 's/5000/1000/g' {} +

      - name: 4. 执行网页编译（自动识别正确目录）
        run: |
          if [ -d "app/frontEnd" ]; then
            cd app/frontEnd
          elif [ -d "frontend" ]; then
            cd frontend
          fi
          npm install
          npm run build

      - name: 5. 【核心】自动搜寻编译好的文件夹并上传
        uses: actions/upload-artifact@v4
        with:
          name: ZTE_U60p_Web_Console_Ready
          path: |
            **/dist/
            **/build/
            !node_modules/
