name: Build U60Pro Tools Clean Binary

on:
  workflow_dispatch: # 支持在 GitHub Actions 界面手动点击运行

jobs:
  build-linux-binary:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 Go 环境
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # 3. 静态交叉编译 (针对 ARM64 / 高通 X75 架构)
      - name: Build Arm64 Static Binary
        run: |
          # CGO_ENABLED=0 是关键：彻底禁用 CGO，实现纯静态编译
          # GOOS=linux GOARCH=arm64 确保目标平台为 64 位 Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ufi-tools-u60p-arm64 main.go

      # 4. 打包并提供下载
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ufi-tools-u60p-arm64
          path: ufi-tools-u60p-arm64
